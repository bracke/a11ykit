name: ci

# Builds a11ykit and runs its suites on Linux, macOS and Windows.
#
# a11ykit pins hostkit and messages by path, and messages pins i18n, whose
# pre-build regeneration downloads tzdata through httpclient -- so CI checks out
# the transitive pin closure next to the checkout and installs OpenSSL, which
# httpclient's TLS bridge links. Every host has its own backend (AT-SPI, UI
# Automation, NSAccessibility); only a matrix says each one still compiles.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # x86_64 macOS: gnat_native=15.2.1 ships no aarch64-darwin binary, so
        # macos-latest (arm64) cannot resolve the pin.
        os: [ubuntu-latest, macos-15-intel, windows-latest]

    steps:
      - name: Check out a11ykit
        uses: actions/checkout@v7
        with:
          path: a11ykit

      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: a11ykit

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use the runner image's Homebrew snapshot: a brew update can move a
          # formula onto a dependency with no Intel bottle, and building that from
          # source runs past the job timeout.
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          # openssl@3 is keg-only; put its lib dir on the linker's search path.
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Install system libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Alire's gnat_native is a mingw-w64 toolchain, so its ld needs mingw
          # import libraries; take them from the preinstalled MSYS2.
          pacman() { /c/msys64/usr/bin/pacman "$@"; }
          pacman-key() { /c/msys64/usr/bin/pacman-key "$@"; }
          pacman-key --init || true
          pacman-key --populate msys2 || true

          packages="mingw-w64-x86_64-openssl"

          sync() {
            pacman -Sy --noconfirm --needed --disable-download-timeout "$@" $packages
          }

          synced=""
          for attempt in 1 2 3; do
            if sync; then synced=yes; break; fi
            echo "::warning::pacman sync attempt ${attempt} failed"
            sleep 15
          done

          if [ -z "$synced" ]; then
            echo "::warning::signed pacman sync failed; retrying without signature checks"
            sed 's/^SigLevel.*/SigLevel = Never/' /c/msys64/etc/pacman.conf \
              > /c/msys64/tmp/pacman-nosig.conf
            for attempt in 1 2 3; do
              if sync --config C:/msys64/tmp/pacman-nosig.conf; then synced=yes; break; fi
              echo "::warning::unsigned pacman sync attempt ${attempt} failed"
              sleep 15
            done
          fi

          [ -n "$synced" ] || { echo "::error::could not install the MSYS2 packages"; exit 1; }

          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found").
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build the library
        shell: bash
        working-directory: a11ykit
        run: alr --non-interactive build

      - name: Build and run the test suites
        shell: bash
        working-directory: a11ykit/tests
        run: |
          alr --non-interactive build
          # The main suite tests the Linux backend, the one the library carries
          # there; every host runs both router suites, which need only the
          # library. The binaries carry .exe on Windows, and bash will not find
          # them under the Unix name. Each suite sets a failing exit status on
          # any FAIL line, and a suite that was not built fails too.
          suites="uia_router_tests nsax_router_tests"
          [ "$RUNNER_OS" = "Linux" ] && suites="a11ykit_tests $suites"
          status=0
          for suite in $suites; do
            exe=./bin/$suite
            [ -f "$exe.exe" ] && exe="$exe.exe"
            echo "::group::$suite"
            "$exe" || { echo "::error::$suite failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Screen-reader client walk (Windows and macOS, exploratory)
        # Runs the focus-walk demo and walks what it exposes with the host's
        # own client API (UI Automation, AXUIElement), the one Narrator and
        # VoiceOver use. Exploratory: it reports, it does not gate.
        if: runner.os != 'Linux'
        continue-on-error: true
        shell: bash
        working-directory: a11ykit
        run: |
          alr --non-interactive exec -- gprbuild -P examples/a11y_examples.gpr \
            || { echo "::warning::examples did not build"; exit 0; }
          demo=examples/bin/focus_walk_demo
          [ -f "$demo.exe" ] && demo="$demo.exe"
          "$demo" 8 &
          pid=$!
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/uia_walk.ps1; code=$?
          else
            sleep 3
            swift .github/scripts/ax_walk.swift "$pid"; code=$?
          fi
          kill "$pid" 2>/dev/null || true
          echo "client walk exit $code on $RUNNER_OS"
          [ "$code" = 0 ] || echo "::warning::the screen-reader client did not reach the demo's items on $RUNNER_OS"
